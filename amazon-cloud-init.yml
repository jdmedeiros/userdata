#cloud-config

# 1) Configure the Corretto yum repository
yum_repos:
  corretto:
    baseurl: "https://yum.corretto.aws"
    enabled: true
    gpgcheck: true
    gpgkey: "https://yum.corretto.aws/corretto.key"
    name: "Amazon Corretto"

# 2) Automatically update and upgrade packages
package_update: true
package_upgrade: true

# 3) Install packages
#    - '@Development Tools' is a group package on RHEL-based distros
#    - 'java-17-amazon-corretto' installs Amazon Corretto 17
packages:
  - '@Development Tools'
  - java-17-amazon-corretto

# 4) runcmd: Additional commands to run after package installation
runcmd:
  # Print Java version (optional)
  - java -version

  # Add Jenkins repository for RHEL/CentOS/Amazon Linux
  - wget -O /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/redhat-stable/jenkins.repo
  - rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io.key

  # Update (optional, since package_update is true, but can be explicit)
  - yum -y update

  # Install Jenkins
  - yum -y install jenkins

  # Optionally enable and start Jenkins at boot
  - systemctl enable jenkins
  - systemctl start jenkins
